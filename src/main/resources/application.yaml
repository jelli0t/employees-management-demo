spring:
  application:
    name: employees-management
  profiles:
    active: dev
  # DATASOURCE
  datasource:
    url: jdbc:h2:mem:employees-management-db
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  # JPA settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console


springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: com.hyperoptic.employees