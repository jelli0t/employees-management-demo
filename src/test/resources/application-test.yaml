spring:
  # DATASOURCE
  datasource:
    url: jdbc:h2:mem:employees-management-test-db
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  # JPA settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
